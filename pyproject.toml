[tool.poetry]
name = "app-runtime-tracker"
version = "0.1.0"
description = "A background application that tracks when other applications are opened and closed, providing a summary of their runtime in hours."
authors = ["Your Name <youremail@example.com>"]
license = "MIT"

[tool.poetry.dependencies]
python = "^3.8"
psutil = "^5.8.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"